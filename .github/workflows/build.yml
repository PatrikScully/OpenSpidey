name: Godot and .NET 64-bit

on:
  push:
    branches: [main, phase2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modern-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed-code:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: modern/global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test managed asset readers and gameplay contracts
        run: python tools/modern.py test
      - name: Build Godot C# assemblies
        run: python tools/modern.py build

  engine-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: modern/global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verified Godot .NET engine
        run: python tools/modern.py bootstrap --godot-only
      - name: Check 64-bit engine startup and physics contracts
        run: python tools/modern.py smoke --physics-checks
